image: golang:1.25.1-alpine

# region import
include:
  - project: "resume/cicd"
    ref: main
    file:
      - "/register_env.yml"
      - "/ssh_setup.yml"

# endregion import

# region 初期値
variables:
  GO_VERSION: "1.25.1"
  GOLANGCI_LINT_VERSION: "v1.64.8"
  GIT_DEPTH: 1
  PROJECT_PATH_SANITIZED: "${CI_PROJECT_NAMESPACE}_${CI_PROJECT_NAME}"
  GOTOOLCHAIN: "local"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/gomod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/gobuild"
  CACHE_BUSTER: "v20260127-1"

# endregion 初期値

# region ステージ設定
stages:
  - prepare
  - test
  - build
  - review
  - deploy

# endregion ステージ設定

# region 共通タスク
# === キャッシュ作成 ===
.cache: &cache
  cache:
    key: "go-${CI_COMMIT_REF_SLUG}-${CACHE_BUSTER}"
    paths:
      - .cache/gomod
      - .cache/gobuild
      - /root/.cache/golangci-lint

# === lint/ut、prebuildの実行に関する変更条件 ===
.go_changes: &go_changes
  changes:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "**/wire.go"
    - "internal/di/**"

# === environment scope の作成・設定 ===
register_env:
  stage: prepare
  extends: .register_env_base

# === CI/CDの環境変数確認 ===
envinfo:
  stage: prepare
  script:
    - 'echo "Branch:           ${CI_COMMIT_REF_NAME}"'
    - 'echo "Pipeline source:  ${CI_PIPELINE_SOURCE}"'
    - 'echo "MR Target:        ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-<none>}"'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never


# === プレビルド：常に実行 ===
prebuild:
  <<: *cache
  stage: prepare
  cache: []
  before_script:
    - rm -rf "$GOMODCACHE/cache/download"
    - rm -rf "$GOCACHE"
    - go install github.com/google/wire/cmd/wire@latest
  script:
    - wire ./internal/di
  artifacts:
    paths:
      - internal/di/wire_gen.go
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      <<: *go_changes
      when: always
    # 1) 任意ビルド（curl / API / 手動実行）
    - if: '$RUN_DEPLOY == "true" && $TARGET_ENV'
      when: on_success
    # 2) develop、staging、mainにマージされたとき自動実行
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/'
      when: always
      variables:
        TARGET_ENV: $CI_COMMIT_BRANCH
#   99) (※暫定※後で消す) 作業時ブランチでプッシュされたときに自動実行
#    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^(develop|staging|main)$/'
#      when: always
#      variables:
#        TARGET_ENV: "develop"
    - when: never

# endregion 共通タスク

# region テストタスク

# === Lint ===
#     develop, staging, main 以外
lint:
  <<: *cache
  stage: test
  needs: ["prebuild"]
  variables:
    CGO_ENABLED: "0"
    GOFLAGS: "-mod=readonly"
  before_script:
    - apk add --no-cache git bash ca-certificates
    # go toolchain はイメージ内の 1.25.1 を使う
    - export GOTOOLCHAIN=local
    - go env
    - go mod download
    - go list ./... >/dev/null

    # ★ dev と同じく Go 1.25.1 で golangci-lint をビルド
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
    - export PATH="$PATH:$(go env GOPATH)/bin"

    - mkdir -p /root/.cache/golangci-lint
  script:
    - echo "Running golangci-lint..."
    - golangci-lint --version
    # .golangci.yml の設定を使って lint + junit 出力
    # （config 側で output.formats に junit-xml: lint-report.xml が定義されている前提）
    #    - golangci-lint run --timeout=5m --config .golangci.yml ./... || true
    - golangci-lint run --timeout=5m --config .golangci.yml ./...
    # もし CLI 側でも明示したいなら ↓ にしてもOK
  #    - golangci-lint run --timeout=5m --config .golangci.yml --out-format junit-xml:lint-report.xml ./... || true
  #    - golangci-lint run --timeout=5m --config .golangci.yml --out-format junit-xml:lint-report.xml ./...

  artifacts:
    when: always
    reports:
      junit: lint-report.xml
    paths:
      - lint-report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "staging" && $CI_COMMIT_BRANCH != "main"'
      <<: *go_changes
      when: always
    - when: never

# === Unit Test ===
#     develop, staging, main 以外
unittest:
  <<: *cache
  stage: test
  needs: ["prebuild"]
  variables:
    CGO_ENABLED: "1"
  before_script:
    - apk add --no-cache lcov bash coreutils build-base sqlite-dev
    - go install gotest.tools/gotestsum@latest
    # - go install github.com/t-yuki/gocover-cobertura@latest   # ← 削除（壊れてる）
  script:
    - go mod download
    - gotestsum --junitfile unit-test-report.xml -- -coverprofile=coverage.out -coverpkg=resume/internal/...  ./tests/unit/...
    - |
      echo "" > coverage.lcov
      while read -r line; do
        case "$line" in
          "mode:"*) continue ;;
          *)
            file=$(echo "$line" | cut -d ':' -f 1 | sed 's|^resume/||')
            data=$(echo "$line" | cut -d ':' -f 2)
            start_line=$(echo "$data" | cut -d ' ' -f 1 | cut -d ',' -f 1 | cut -d '.' -f 1)
            end_line=$(echo "$data" | cut -d ' ' -f 1 | cut -d ',' -f 2 | cut -d '.' -f 1)
            count=$(echo "$data" | cut -d ' ' -f 3)
            echo "TN:" >> coverage.lcov
            echo "SF:$file" >> coverage.lcov
            for i in $(seq "$start_line" "$end_line"); do
              echo "DA:$i,$count" >> coverage.lcov
            done
            echo "end_of_record" >> coverage.lcov
            ;;
        esac
      done < coverage.out
    # デバッグしたければ一時的に
    - head -n 20 coverage.out
    - head -n 40 coverage.lcov
  #    - mkdir -p coverage
  #    - genhtml -o coverage coverage.lcov
  artifacts:
    when: always
    reports:
      junit: unit-test-report.xml
    paths:
      - unit-test-report.xml
      - coverage.out
      - coverage.lcov
  #      - coverage/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "staging" && $CI_COMMIT_BRANCH != "main"'
      <<: *go_changes
      when: always
    - when: never

# === コードカバレッジ ===
coverage:
  stage: deploy
  needs:
    - job: unittest
      artifacts: true
  before_script:
    - apk add --no-cache lcov
  script:
    - echo "=== mount check ==="
    - mkdir -p /var/coverage || true
    - mount | grep /var/coverage || echo "NOT MOUNTED"
    - DEST="/var/coverage/${PROJECT_PATH_SANITIZED}"
    - echo "DEST=$DEST"

    # 1. マウントしている /var/coverage を毎回空にする
    - rm -rf "$DEST"
    - mkdir -p "$DEST"

    # 0. coverage.lcov に中身がない場合はスキップ
    - |
      if ! grep -q "^SF:" coverage.lcov; then
        echo "No coverage data found in coverage.lcov. Skipping genhtml."
        exit 0
      fi

    # 0.5 internal/di/wire_gen.go のレコードを coverage.lcov から削除
    #     （SF:internal/di/wire_gen.go ～ end_of_record までを丸ごと落とす）
    - |
      awk '
        /^SF:internal\/di\/wire_gen.go$/ { skip=1 }   # wire_gen.go のレコード開始
        skip && /^end_of_record$/ { skip=0; next }    # レコード終端を読んで skip 終了
        skip { next }                                 # skip 中の行は出力しない
        { print }                                     # それ以外はそのまま出力
      ' coverage.lcov > coverage.filtered.lcov
      mv coverage.filtered.lcov coverage.lcov

    # 2. coverage.lcov から HTML 生成（source エラーは念のため無視）
    - genhtml coverage.lcov -o "$DEST" --ignore-errors source

  # artifacts は /var/coverage 以下なので削ったままでOK（マウント先に直接出す運用）
  #  artifacts:
  #    when: always
  #    paths:
  #      - "/var/coverage/$PROJECT_PATH_SANITIZED"
  #    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "staging" && $CI_COMMIT_BRANCH != "main"'
      <<: *go_changes
      when: always
    - when: never

# endregion テストタスク

# region ビルド設定
# === .env の作成・設定 ===
make_env:
  stage: build
  script:
    - umask 077
    - cp "$APP_ENV" .env
    - chmod 600 .env
  variables:
    TARGET_ENV: "develop"
  environment:
    name: $TARGET_ENV
  artifacts:
    expire_in: 1hour
    paths:
      - .env
  rules:
    # 1) 任意ビルド（curl / API / 手動実行）
    - if: '$RUN_DEPLOY == "true" && $TARGET_ENV'
      when: on_success
    # 2) develop、staging、mainにマージされたとき自動実行
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/'
      when: always
      variables:
        TARGET_ENV: $CI_COMMIT_BRANCH
    # 99) (※暫定※後で消す) 作業時ブランチでプッシュされたときに自動実行
#    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^(develop|staging|main)$/'
#      when: always
#      variables:
#        TARGET_ENV: "develop"
    - when: never

# === Firebaseの鍵情報作成 ===
make_credential:
  stage: build
  script:
    - umask 077
    - mkdir -p secrets
    - printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > secrets/firebase-sa.json
    - chmod 600 secrets/firebase-sa.json
  variables:
    TARGET_ENV: "develop"
  environment:
    name: $TARGET_ENV
  artifacts:
    expire_in: 1hour
    paths:
      - secrets/firebase-sa.json
  rules:
    # 1) 任意ビルド（curl / API / 手動実行）
    - if: '$RUN_DEPLOY == "true" && $TARGET_ENV'
      when: on_success
    # 2) develop、staging、mainにマージされたとき自動実行
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/'
      when: always
      variables:
        TARGET_ENV: $CI_COMMIT_BRANCH
    # 99) (※暫定※後で消す) 作業時ブランチでプッシュされたときに自動実行
#    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^(develop|staging|main)$/'
#      when: always
#      variables:
#        TARGET_ENV: "develop"
    - when: never

# endregion ビルド設定

# region ビルドジョブ
build:
  stage: build
  cache: []
  needs:
    - job: prebuild
      artifacts: true
    - job: make_env
      artifacts: true
  rules:
    # 1) 任意ビルド（curl / API / 手動実行）
    - if: '$RUN_DEPLOY == "true" && $TARGET_ENV'
      when: on_success
    # 2) develop、staging、mainにマージされたとき自動実行
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/'
      when: always
      variables:
        TARGET_ENV: $CI_COMMIT_BRANCH
    # 99) (※暫定※後で消す) 作業時ブランチでプッシュされたときに自動実行
#    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^(develop|staging|main)$/'
#      when: always
#      variables:
#        TARGET_ENV: "develop"
    - when: never
#  image: golang:1.25.1-alpine
  image: golang:1.25.1
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git
    - update-ca-certificates
    - go mod download
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/api ./cmd/api
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/migrate ./cmd/migrate

#    - apk add --no-cache ca-certificates git
#    - mkdir -p bin

    # Go toolchain はイメージ内を使う
#    - export GOTOOLCHAIN=local

    # 壊れやすいのは “download キャッシュ” なのでそこだけ「汎用的に」消す
#    - rm -rf "$GOMODCACHE/cache/download"

    # 安定寄りの取得設定（必要に応じて direct のみにも切替可）
#    - export GOPROXY="https://proxy.golang.org"
#    - export GOSUMDB="sum.golang.org"

    # 透過プロキシ/HTTP2 起因の破損回避（まず試す価値あり）
#    - export GODEBUG="http2client=0"

    # 一時的なネットワーク破損に備えてリトライ
#    - |
#      set -eu
#      go mod download || {
#        echo "go mod download failed -> purge download cache and retry once"
#        rm -rf "$GOMODCACHE/cache/download"   # /go/pkg/mod を使うならそのパスに
#        go mod download
#      }

#    - export GOCACHE=/root/.cache/go-build
#    - rm -rf "$GOCACHE"
#    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/api ./cmd/api
#    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/migrate ./cmd/migrate
  artifacts:
    paths:
      - bin/api
      - bin/migrate
      - migrations/
    expire_in: 1hour

# endregion ビルドジョブ

# region デプロイ設定
# === sshの接続確認 ===
#     デプロイ前にデプロイ先にsshが繋がることを確認
check_ssh:
  stage: deploy
  extends: .ssh_setup_base
  variables:
    TARGET_ENV: develop
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "echo 'ssh test success'"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo echo 'sudo test success'"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n whoami"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n pwd"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 1) 任意ビルド（curl / API / 手動実行）
    - if: '$RUN_DEPLOY == "true" && $TARGET_ENV'
      when: on_success
    # 2) develop、staging、mainにマージされたとき自動実行
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/'
      when: always
      variables:
        TARGET_ENV: $CI_COMMIT_BRANCH
    # 99) (※暫定※後で消す) 作業時ブランチでプッシュされたときに自動実行
#    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^(develop|staging|main)$/'
#      when: always
#      variables:
#        TARGET_ENV: "develop"
    - when: never

# endregion デプロイ設定

# region デプロイジョブ
# 共通デプロイジョブ：develop/staging/main用
deploy:
  stage: deploy
  extends: .ssh_setup_base
  needs:
    - job: check_ssh
    - job: prebuild
      artifacts: true
    - job: make_env
      artifacts: true
    - job: make_credential
      artifacts: true
    - job: build
      artifacts: true
  variables:
    TARGET_ENV: "develop"
  environment:
    name: $TARGET_ENV
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 1) 任意ビルド（curl / API / 手動実行）
    - if: '$RUN_DEPLOY == "true" && $TARGET_ENV'
      when: on_success
    # 2) develop、staging、mainにマージされたとき自動実行
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/'
      when: always
      variables:
        TARGET_ENV: $CI_COMMIT_BRANCH
    # 99) (※暫定※後で消す) 作業時ブランチでプッシュされたときに自動実行
#    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH !~ /^(develop|staging|main)$/'
#      when: always
#      variables:
#        TARGET_ENV: "develop"
    - when: never
  script:
    - echo "Deploying start. branch - $CI_COMMIT_BRANCH . Target ENV - $TARGET_ENV"

    # デプロイ用環境変数の読込
    - |
      set -a
      . "$DEPLOY_ENV"
      set +a

    # 配布先ディレクトリの作成
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $APP_PATH"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $APP_PATH/configs"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $APP_PATH/internal/shared/i18n/locales"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $CREDENTIAL_PATH"

    # 1. バイナリとマイグレーション
    - rsync -az --delete bin "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH"
    - rsync -az --delete migrations "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH"

    # 2. 実行に必要な設定ファイル (ソースから直接送る)
    - rsync -az --delete configs/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH/configs/"
    - rsync -az --delete internal/shared/i18n/locales/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH/internal/shared/i18n/locales/"

    # 3. 生成物 (.env と Firebaseの鍵)
    - scp .env "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH/.env"
    - rsync -az --delete secrets "$DEPLOY_USER@$DEPLOY_HOST:$CREDENTIAL_PATH"

    - echo "Deploying finish. branch - $CI_COMMIT_BRANCH . Target ENV - $TARGET_ENV"

# endregion デプロイジョブ

after_script:
  - 'echo "source : ${CI_PIPELINE_SOURCE} . branch : ${CI_COMMIT_BRANCH} . Backend CI/CD finished."'

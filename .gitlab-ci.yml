pre-build-job:
  stage: pre-build
  image: golang:1.24.4-alpine
  before_script:
    - go install github.com/google/wire/cmd/wire@latest
    - wire ./di || true
  script:
    - wire
  artifacts:
    paths:
      - di/wire_gen.go

lint-job:
  stage: test
#  image: golang:1.24.2
  image: golangci/golangci-lint:v1.64.8
  script:
    - echo "Running revive lint check..."
    - echo "Current dir $(pwd)"
    - ls -la .golangci.yml
    - golangci-lint --version
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - export PATH=$PATH:/go/bin
    - golangci-lint run --config .golangci.yml --out-format junit-xml ./... > lint-report.xml
  artifacts:
    when: always
    reports:
      junit: lint-report.xml
    paths:
      - lint-report.xml

unit-test-job:
  stage: test
  image: golang:1.24.4-alpine
  before_script:
    - go install gotest.tools/gotestsum@latest
    - go install github.com/t-yuki/gocover-cobertura@latest
  script:
    - go mod tidy
    - gotestsum --junitfile unit-test-report.xml -- -coverprofile=coverage.out ./...
    - gocover-cobertura < coverage.out > coverage.xml
  artifacts:
    reports:
      junit: unit-test-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
      - coverage.html

deploy-develop-job:
  script:
    - echo "test"

deploy-staging-job:
  script:
    - echo "test"

deploy-prod-job:
  script:
    - echo "test"

